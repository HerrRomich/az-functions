name: Publish NPM package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.30.3

jobs:
  validate:

    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build package
        run: pnpm --filter "$package" c:build

      - name: Check package contents
        run: pnpm --filter "$package" pack --pack-destination ./artifacts

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter "$package" dist:build:recursive

      - name: Publish to npm
        run: pnpm --filter "$package" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish NPM package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

env:
  NODE_VERSION: 22
  PNPM_VERSION: 12.4.1

jobs:
  validate:

    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: build package
        run: pnpm --filter "${{inputs.package}}" ci:build:recursive

      - name: Check package contents
        run: pnpm --filter "${{inputs.package}}" pack --pack-destination ./artifacts

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter "${{inputs.package}}" dist:build:recursive

      - name: Publish to npm
        run: pnpm --filter "${{inputs.package}}" publish --access public --no-git-checks --provenance
